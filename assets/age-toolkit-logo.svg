<svg width="960" height="320" viewBox="0 0 1024 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">AGE Bootstrap Toolkit logo</title>
  <desc id="logoDesc">A futuristic cyan and gold emblem with AGE wordmark for the AGE Bootstrap Toolkit.</desc>
  <defs>
    <linearGradient id="bgGlow" x1="64" y1="32" x2="320" y2="288" gradientUnits="userSpaceOnUse">
      <stop stop-color="#143985"/>
      <stop offset="1" stop-color="#040D29"/>
    </linearGradient>
    <linearGradient id="frameStroke" x1="72" y1="40" x2="312" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1CF6FF"/>
      <stop offset="0.65" stop-color="#47D3FF"/>
      <stop offset="1" stop-color="#634BFF"/>
    </linearGradient>
    <linearGradient id="goldFill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF18A"/>
      <stop offset="1" stop-color="#FFE53B"/>
