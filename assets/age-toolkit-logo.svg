  <rect width="1024" height="320" rx="32" fill="#020616"/>
  <path d="M32 96C156 18 354 16 506 76C640 128 789 130 928 78" stroke="#47D3FF" stroke-opacity="0.1" stroke-width="2"/>
  <path d="M32 244C180 188 342 186 484 218C622 249 786 255 928 224" stroke="#634BFF" stroke-opacity="0.16" stroke-width="2"/>
